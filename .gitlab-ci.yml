stages:
  - build

build-and-publish:
  image: ${REGISTRY_DOCKER_URL}/maven:3.6.3-openjdk-8-slim
  stage: build
  variables:
    USER_HOME: "/var/maven"
    MAVEN_CONFIG: "${USER_HOME}/.m2"
  rules:
    - when: manual
  tags:
    - sts-k8s-m-runner
  before_script:
    - mkdir -p "$MAVEN_CONFIG"
    - |
      cat > "$MAVEN_CONFIG/settings.xml" <<EOF
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
        xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
        xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
        http://maven.apache.org/xsd/settings-1.0.0.xsd">

        <servers>
          <server>
            <id>gitlab-packages-registry</id>
            <username>${GITLAB_PACKAGE_REGISTRY_USER}</username>
            <password>${GITLAB_PACKAGE_REGISTRY_TOKEN}</password>
          </server>
        </servers>
      </settings>
      EOF
  script: mvn -Dgitlab_registry_url="${GITLAB_PACKAGE_REGISTRY_MAVEN_URL}" -Duser.home="${USER_HOME}" deploy
